<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tryout SIMAK UI Pascasarjana</title>
  <script>
    // Terapkan tema sedini mungkin agar tidak ada kedip (flash) saat memuat.
    try {
      var t = localStorage.getItem("tryout_simak_ui_theme");
      if (t === "dark" || (!t && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches))
        document.documentElement.setAttribute("data-theme", "dark");
      // Pulihkan kondisi sidebar (lipat) sedini mungkin agar tidak berkedip.
      if (localStorage.getItem("tryout_simak_ui_sidebar") === "collapsed")
        document.documentElement.classList.add("sidebar-collapsed");
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <!-- ---------- Sidebar (ala Claude: bisa dibuka & ditutup) ---------- -->
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
      <div class="sidebar-head">
        <div class="brand">
          <span class="logo">UI</span>
          <div class="brand-text">
            <h1>Tryout SIMAK UI</h1>
            <p class="tagline">Latihan soal S2/S3 mode ujian</p>
          </div>
        </div>
        <button class="sidebar-collapse" id="sidebarCollapse" title="Lipat sidebar" aria-label="Lipat sidebar">«</button>
      </div>

      <nav class="mainnav" id="mainnav">
        <button class="navbtn active" data-view="home"><span class="nav-ico">🏠</span><span class="nav-label">Beranda</span></button>
        <button class="navbtn" data-view="practice"><span class="nav-ico">✏️</span><span class="nav-label">Latihan</span></button>
        <button class="navbtn" data-view="stats"><span class="nav-ico">📊</span><span class="nav-label">Statistik</span></button>
        <button class="navbtn" data-view="input"><span class="nav-ico">➕</span><span class="nav-label">Input Soal</span></button>
        <button class="navbtn" data-view="bank"><span class="nav-ico">🗂️</span><span class="nav-label">Bank Soal</span></button>
        <button class="navbtn" data-view="materi"><span class="nav-ico">📚</span><span class="nav-label">Materi</span></button>
        <button class="navbtn" data-view="achievements"><span class="nav-ico">🏆</span><span class="nav-label">Pencapaian</span></button>
        <button class="navbtn" data-view="adminusers"><span class="nav-ico">👥</span><span class="nav-label">Kelola User</span></button>
        <button class="navbtn" data-view="account"><span class="nav-ico">👤</span><span class="nav-label">Masuk</span></button>
      </nav>

      <div class="sidebar-foot">
        <button class="theme-toggle" id="themeToggle" title="Ganti tema gelap/terang" aria-label="Ganti tema gelap/terang">🌙</button>
        <span class="theme-label">Tema</span>
      </div>
    </aside>

    <!-- ---------- Area konten ---------- -->
    <div class="content">
      <header class="topbar-mobile">
        <button class="hamburger" id="sidebarOpen" title="Buka menu" aria-label="Buka menu">☰</button>
        <div class="brand">
          <span class="logo">UI</span>
          <h1>Tryout SIMAK UI</h1>
        </div>
      </header>
      <main id="app"></main>
    </div>
  </div>

  <!-- Latar gelap saat sidebar terbuka di layar kecil -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

  <!-- Templates rendered via JS into #app -->
  <script src="app.js"></script>
</body>
</html>
