<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tryout Superr</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#f5c518" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1d1d1f" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Tryout Superr" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <script>
    // Terapkan tema sedini mungkin agar tidak ada kedip (flash) saat memuat.
    try {
      var t = localStorage.getItem("tryout_simak_ui_theme");
      if (t === "dark" || (!t && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches))
        document.documentElement.setAttribute("data-theme", "dark");
      // Pulihkan kondisi sidebar (lipat) sedini mungkin agar tidak berkedip.
      if (localStorage.getItem("tryout_simak_ui_sidebar") === "collapsed")
        document.documentElement.classList.add("sidebar-collapsed");
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <!-- ---------- Sidebar (ala Claude: bisa dibuka & ditutup) ---------- -->
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
      <div class="sidebar-head">
        <div class="brand">
          <span class="logo">TS</span>
          <div class="brand-text">
            <h1>Tryout Superr</h1>
          </div>
        </div>
        <button class="sidebar-collapse" id="sidebarCollapse" title="Lipat / bentangkan sidebar" aria-label="Lipat / bentangkan sidebar">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2.5"/>
            <path d="M9 3v18"/>
          </svg>
        </button>
      </div>

      <nav class="mainnav" id="mainnav">
        <div class="nav-section">Belajar</div>
        <button class="navbtn active" data-view="home"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span><span class="nav-label">Beranda</span></button>
        <button class="navbtn" data-view="practice"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg></span><span class="nav-label">Latihan</span></button>
        <button class="navbtn" data-view="stats"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg></span><span class="nav-label">Statistik</span></button>
        <button class="navbtn" data-view="materi"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></span><span class="nav-label">Materi</span></button>
        <button class="navbtn" data-view="achievements"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg></span><span class="nav-label">Pencapaian</span></button>
        <div class="nav-section">Kelola Konten</div>
        <button class="navbtn" data-view="input"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg></span><span class="nav-label">Input Soal</span></button>
        <button class="navbtn" data-view="bank"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg></span><span class="nav-label">Bank Soal</span></button>
        <div class="nav-section">Administrasi</div>
        <button class="navbtn" data-view="adminresults"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg></span><span class="nav-label">Hasil Ujian</span></button>
        <button class="navbtn" data-view="adminusers"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span class="nav-label">Kelola User</span></button>
        <button class="navbtn" data-view="account"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="nav-label">Masuk</span></button>
      </nav>

      <div class="sidebar-foot">
        <button class="theme-toggle" id="themeToggle" title="Ganti tema gelap/terang" aria-label="Ganti tema gelap/terang">🌙</button>
        <span class="theme-label">Tema</span>
      </div>
    </aside>

    <!-- ---------- Area konten ---------- -->
    <div class="content">
      <header class="topbar-mobile">
        <button class="hamburger" id="sidebarOpen" title="Buka menu" aria-label="Buka menu">☰</button>
        <div class="brand">
          <span class="logo">TS</span>
          <h1>Tryout Superr</h1>
        </div>
      </header>
      <main id="app"></main>
    </div>
  </div>

  <!-- Latar gelap saat sidebar terbuka di layar kecil -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

  <!-- Templates rendered via JS into #app -->
  <script src="app.js"></script>
  <script>
    // Daftarkan service worker (PWA: bisa diinstal & dibuka offline).
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("service-worker.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
